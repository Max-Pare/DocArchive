# Unbounded json-file logs will fill a VPS disk. Every service references this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: docarchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ./.env}
      POSTGRES_DB: docarchive
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docarchive"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    environment:
      # `environment:` overrides `env_file:`, so POSTGRES_PASSWORD in ./.env is the
      # single source of truth for the DB password. Keeping a second copy inside
      # backend/.env is what silently broke this deploy.
      DATABASE_URL: postgresql+psycopg2://docarchive:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ./.env}@db:5432/docarchive
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - file_data:/data/files
    # Tesseract rasterizes PDF pages at PDF_DPI into memory; without a ceiling a
    # large multi-page scan can OOM the whole host, not just this container.
    deploy:
      resources:
        limits:
          memory: 1500M

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # busybox wget ships in nginx:alpine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        # nginx only serves static files, so this is not a hard requirement. It is
        # ordering: the SPA's first render immediately calls /api, and the backend
        # runs migrations and seeding before it serves. Coming up after the backend
        # is healthy means a cold boot never shows a login screen that 502s.
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # set to your public domain; use ":80" for local/no-TLS
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db_data:
  file_data:
  caddy_data:
  caddy_config:
