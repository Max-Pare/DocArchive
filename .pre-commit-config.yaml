# Install once:  pip install pre-commit && pre-commit install
# Run over everything:  pre-commit run --all-files
#
# Deliberately fast hooks only. pytest and mypy are NOT here: slow hooks get
# bypassed with --no-verify, and then nothing runs at all. CI owns the slow checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # This project shipped with entrypoint.sh at mode 644 while the Dockerfile
      # did CMD ["./entrypoint.sh"], so the container died with exit 126 and the
      # app never ran once. This hook is the cheapest permanent guard against it.
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-yaml
        # Compose/Actions files use YAML the strict parser rejects in places.
        args: [--allow-multiple-documents]
        # ops/docker-compose.verify.yml uses Compose's `!override` tag, which is
        # meaningful to Compose and unparseable by a plain YAML loader. Excluding
        # the file beats --unsafe, which would stop constructing tags everywhere
        # and quietly weaken this check for the other twelve yaml files.
        exclude: ^ops/docker-compose\.verify\.yml$
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      # Medical data, a real .env on disk, and secrets that were being baked into
      # image layers: this repo has exactly the profile where a key gets committed.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ops/ is four shell scripts that run when the archive is already in trouble.
  # That is exactly the code you do not want to debug by discovering an unquoted
  # variable during a restore.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # -x makes shellcheck follow `source ops/lib.sh`. Without it every ops
        # script reports SC1091, because pre-commit passes files one at a time
        # and shellcheck will not open a file it was not handed.
        args: [-x]

  # Frontend formatting/linting runs from the local workspace so it uses the exact
  # versions in frontend/package-lock.json rather than a second, drifting copy.
  # Enable once eslint/prettier land in the quality wave.
  # - repo: local
  #   hooks:
  #     - id: frontend-lint
  #       name: eslint (frontend)
  #       entry: npm --prefix frontend exec eslint --
  #       language: system
  #       files: ^frontend/src/.*\.(ts|tsx)$
