name: CI

# Deliberately NO version matrix. This repo ships exactly one runtime: Python
# 3.12 (backend/Dockerfile: python:3.12-slim) and Node 24 (frontend/Dockerfile:
# node:24-alpine). Testing anything else would be testing software we do not run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 0. A ~40-second gate in front of the slow jobs.
  #
  #    This is the ONLY place `needs:` is used. Everything downstream still runs
  #    in parallel with everything else; what a gate buys is latency to first
  #    red, and only when it is much faster than what it gates. A broken
  #    Caddyfile used to cost 15 minutes to discover inside `smoke`. It now costs
  #    40 seconds. Adding `needs: backend-test` to `smoke` would buy nothing and
  #    cost eight minutes of wall clock, so it is deliberately absent.
  #
  #    It is also where runtime versions are resolved once, so no job pins a
  #    version the shipped images do not use.
  # ---------------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.versions.outputs.python }}
      node: ${{ steps.versions.outputs.node }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve runtime versions from the Dockerfiles
        id: versions
        run: |
          set -euo pipefail
          # Single source of truth: the images we actually ship. A hardcoded
          # "3.12" here drifts silently the moment a base-image bump lands, and
          # then CI is testing a runtime that is not in production.
          python_version="$(sed -n 's/^FROM python:\([0-9][0-9]*\.[0-9][0-9]*\)-.*/\1/p' backend/Dockerfile | head -1)"
          node_version="$(sed -n 's/^FROM node:\([0-9][0-9]*\)[-.].*/\1/p' frontend/Dockerfile | head -1)"

          if [ -z "${python_version}" ]; then
            echo "::error file=backend/Dockerfile::could not parse a Python version from the FROM line"
            grep -n '^FROM' backend/Dockerfile
            exit 1
          fi
          if [ -z "${node_version}" ]; then
            echo "::error file=frontend/Dockerfile::could not parse a Node major from the FROM line"
            grep -n '^FROM' frontend/Dockerfile
            exit 1
          fi

          echo "python=${python_version}" >> "${GITHUB_OUTPUT}"
          echo "node=${node_version}" >> "${GITHUB_OUTPUT}"
          echo "python ${python_version}, node ${node_version}"

      - name: Postgres version has not drifted between compose and CI
        run: |
          set -euo pipefail
          # Assert rather than interpolate. GitHub does allow an expression in
          # services.<id>.image, but a mis-scoped one evaluates to empty and
          # silently falls back - whereas a failed grep is loud. Dependabot's
          # docker ecosystem rewrites compose files and never touches a
          # workflow's `services:` block, so without this the two drift apart
          # and CI keeps testing the old major forever.
          tag="$(sed -n 's/^[[:space:]]*image:[[:space:]]*postgres:\(.*\)$/\1/p' docker-compose.yml | head -1)"
          [ -n "${tag}" ] || { echo "::error file=docker-compose.yml::no postgres image tag found"; exit 1; }
          if ! grep -qF "image: postgres:${tag}" .github/workflows/ci.yml; then
            echo "::error file=.github/workflows/ci.yml::docker-compose.yml uses postgres:${tag} but this workflow does not. Update the backend-test service image."
            exit 1
          fi
          echo "both on postgres:${tag}"

      - name: Compose config is valid
        run: |
          set -euo pipefail
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose config -q
          echo "docker compose config OK"

      - name: Caddyfile is valid
        run: |
          set -euo pipefail
          # A broken Caddyfile previously surfaced only when the smoke job's proxy
          # refused to start, 15 minutes in.
          docker run --rm \
            -v "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS=:80 \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Shell scripts
        run: |
          set -euo pipefail
          shellcheck ops/*.sh backend/entrypoint.sh .github/scripts/*.sh

          # A direct callback to the exit-126 outage: entrypoint.sh shipped mode
          # 644 while the Dockerfile did CMD ["./entrypoint.sh"], so the app never
          # ran once. ops/restore.sh discovered non-executable at 2am, during an
          # actual restore, is the same bug with a worse blast radius.
          missing=0
          for f in ops/*.sh backend/entrypoint.sh .github/scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "::error file=${f}::script is not executable (git update-index --chmod=+x ${f})"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  # ---------------------------------------------------------------------------
  # 1. Backend unit/integration tests against a real Postgres 16.
  # ---------------------------------------------------------------------------
  backend-test:
    # Stable, version-free name: a required status check cannot be renamed
    # without silently making the requirement unsatisfiable, and a name
    # containing "py3.12" becomes a lie the moment the version is derived.
    name: backend tests
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docarchive
          POSTGRES_PASSWORD: docarchive
          POSTGRES_DB: docarchive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docarchive -d docarchive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://docarchive:docarchive@localhost:5432/docarchive_test
      # Without this, an unset or typo'd TEST_DATABASE_URL makes every DB-backed
      # test skip and pytest still exits 0 - which is exactly how this suite
      # managed to never run. In CI a missing or broken DB is a hard failure.
      DOCARCHIVE_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OCR system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-ita \
            poppler-utils
          tesseract --version
          # The Italian model is not optional: OCR_LANGUAGES=ita, so a missing
          # traineddata file turns every OCR into a silent ocr_failed.
          tesseract --list-langs
          tesseract --list-langs | grep -qx ita
          command -v pdftoppm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.validate.outputs.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # requirements-dev.txt starts with `-r requirements.txt`, so this is the
          # runtime deps plus the test tooling. pip resolves the nested -r relative
          # to the file it appears in, so running from the repo root is fine.
          pip install -r backend/requirements-dev.txt

      - name: Exactly one Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          # `alembic heads` reads alembic/versions/ only - it never opens a DB
          # connection - so this is cheap and needs no service wiring. Two heads
          # means someone branched the migration chain, and `alembic upgrade head`
          # then refuses to run on the VPS.
          alembic heads
          count="$(alembic heads | grep -c '(head)' || true)"
          echo "alembic heads found: ${count}"
          if [ "${count}" -ne 1 ]; then
            echo "::error::expected exactly 1 Alembic head, found ${count}. Merge the branched revisions with 'alembic merge'."
            exit 1
          fi

      - name: pytest
        working-directory: backend
        run: |
          set -euo pipefail
          # -ra surfaces skip reasons: a suite that silently stops running is the
          # failure mode this whole job exists to prevent.
          # Coverage is REPORTED, never gated. A --cov-fail-under threshold on a
          # young suite only teaches people to write assertion-free tests.
          # The xml report is uploaded below: until now the number was computed
          # and then thrown away, so it could never be tracked over time.
          # Branch coverage comes from [tool.coverage.run] in pyproject.toml.
          pytest -ra --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Backend lint. Advisory only, for now.
  # ---------------------------------------------------------------------------
  backend-lint:
    name: backend lint (ruff, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO: flip this to `continue-on-error: false` (or just delete the line) as
    # soon as the one-time `ruff check --fix` + `ruff format` commit lands. The
    # code has never been formatted, so today this job reports ~60 findings and
    # ~12 files to reformat; blocking on that would only teach everyone to ignore
    # a red build.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install ruff (same pin the test job uses)
        run: |
          set -euo pipefail
          # Install ONLY ruff - the full requirements-dev.txt is minutes of wheels
          # this job never touches - but read the version from requirements-dev.txt
          # so there is a single pinned source of truth.
          spec="$(grep -E '^ruff==' backend/requirements-dev.txt || true)"
          if [ -z "${spec}" ]; then
            echo "::error::no pinned 'ruff==' line in backend/requirements-dev.txt"
            exit 1
          fi
          echo "installing ${spec}"
          python -m pip install --upgrade pip
          pip install "${spec}"
          ruff --version

      - name: ruff check
        working-directory: backend
        # Config lives in backend/pyproject.toml ([tool.ruff]).
        run: ruff check --output-format=github .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check --diff .

  # ---------------------------------------------------------------------------
  # 3. Frontend typecheck + production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node major comes from `validate`, which reads it out of
      # frontend/Dockerfile. Note jsdom requires ^22.22.2 || ^24.15.0 || >=26.0.0,
      # so an EOL Node fails the vitest step outright rather than degrading
      # quietly.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.validate.outputs.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        # `npm run build` is `tsc && vite build` and would catch this too, but
        # running tsc first gives a clean "the types are broken" signal instead of
        # a confusing bundler failure.
        run: npx tsc --noEmit

      # The lint step that used to sit here ran `npm run lint --if-present`
      # against a package.json with no `lint` script and a repo with no eslint
      # config anywhere, so it printed a green check for zero work from the day
      # it was written. `--if-present` was the right intent and the wrong
      # mechanism: it makes "the tool is not installed" indistinguishable from
      # "the tool passed". Deleting a step that does nothing is strictly an
      # improvement; a real one lands with the eslint config.

      - name: Unit tests
        working-directory: frontend
        # Assert-then-run, which is the general fix for --if-present: it fails
        # loudly on the day the script genuinely is not there, which is the day
        # you most need to know. Previously a rename or an accidental deletion of
        # `test` would have converted the only frontend test gate into a no-op
        # with a green check.
        #
        # Actions sets CI=true, so vitest runs once instead of entering watch
        # mode. The step timeout is belt-and-braces in case a watch-mode script
        # lands.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [ "$(npm pkg get scripts.test)" = "{}" ]; then
            echo "::error file=frontend/package.json::the 'test' script is gone - the only frontend test gate would silently become a no-op"
            exit 1
          fi
          # test:coverage, not test. @vitest/coverage-v8 has been a devDependency
          # since it landed and nothing has ever invoked it, so no frontend
          # coverage number has ever existed.
          npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Smoke: build and boot the ACTUAL shipped stack, then use it over HTTP.
  #
  #    This job exists because of a real outage. backend/entrypoint.sh was
  #    committed mode 644 and the Dockerfile never chmod-ed it, so
  #    CMD ["./entrypoint.sh"] died with exit 126 on every single boot and the
  #    application had literally never run. No unit test can catch that. This job
  #    can, and it is the reason this workflow exists - treat it as the
  #    centrepiece, not as an optional extra.
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (compose boot + HTTP + OCR round-trip)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Throwaway credentials for a stack that is destroyed at the end of the job.
      # Deliberately NOT repository secrets: keeping them in plain sight is what
      # makes the /api/auth/me assertion below readable, and there is nothing here
      # to protect.
      # example.com, not example.test: UserOut.email is an EmailStr, and
      # email-validator rejects the RFC 2606 special-use TLDs (.test, .local,
      # .invalid, .localhost). Login still succeeds with one - the form field is a
      # plain string - but GET /auth/me then 500s serialising the response.
      SMOKE_ADMIN_EMAIL: smoke-admin@example.com
      SMOKE_ADMIN_PASSWORD: smoke-admin-not-a-secret
      # Pinned so the image tags built below are exactly the ones compose looks
      # for. Derived from the directory name it would be "docarchive" anyway, but
      # relying on that makes a rename silently disable the build cache.
      COMPOSE_PROJECT_NAME: docarchive

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Synthesize env files from the committed examples
        run: .github/scripts/synthesize-env.sh

      # Built here rather than by `docker compose build` so the layer cache can be
      # wired up: without it this job rebuilt python:3.12-slim + apt-get
      # tesseract-ocr + tesseract-ocr-ita + poppler-utils + a 17-package pip
      # install from scratch on every run, which was the bulk of the 20-minute
      # budget.
      #
      # The tags are exactly what compose would have produced for this project
      # (<project>-<service>:latest), which is why COMPOSE_PROJECT_NAME is pinned
      # in this job's env. `docker compose up` below then finds them and builds
      # nothing. Bake was the obvious alternative and does not work here: reading
      # targets from a compose file yields no tags at all, so --load produces
      # images compose cannot see.
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          build-args: GIT_SHA=${{ github.sha }}
          tags: docarchive-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: docarchive-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Images are where compose expects them
        run: |
          set -euo pipefail
          # If this assumption ever breaks, `up` would silently rebuild without
          # the cache and the job would just get slower - a regression nobody
          # would notice. Fail loudly instead.
          docker image inspect docarchive-backend:latest >/dev/null
          docker image inspect docarchive-frontend:latest >/dev/null
          docker compose config --images

      - name: docker compose up --wait
        run: |
          set -euo pipefail
          # THE step. It fails on:
          #   * entrypoint.sh not executable      -> the container dies with 126
          #   * a failed `alembic upgrade head`   -> backend exits non-zero
          #   * a missing or bad env value        -> compose refuses to start
          #   * a broken Caddyfile or nginx.conf  -> proxy / frontend exit
          docker compose up -d --wait --wait-timeout 300

      - name: Assert every service is running, not crash-looping
        run: |
          set -euo pipefail
          # `restart: unless-stopped` means a container that dies with 126 comes
          # straight back, so it can flicker through "running" and slip past
          # `--wait`. A non-zero RestartCount is the tell. This is the direct
          # regression guard for the outage that motivated this workflow.
          fail=0
          for svc in $(docker compose ps --services); do
            cid="$(docker compose ps -q "${svc}" || true)"
            if [ -z "${cid}" ]; then
              echo "::error::service ${svc} has no container"
              fail=1
              continue
            fi
            state="$(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.ExitCode}}' "${cid}")"
            status="$(echo "${state}" | cut -d' ' -f1)"
            restarts="$(echo "${state}" | cut -d' ' -f2)"
            exitcode="$(echo "${state}" | cut -d' ' -f3)"
            echo "${svc}: status=${status} restarts=${restarts} exit=${exitcode}"
            if [ "${status}" != "running" ] || [ "${restarts}" -ne 0 ]; then
              echo "::error::${svc} is not cleanly running (status=${status} restarts=${restarts} exit=${exitcode})"
              fail=1
            fi
          done
          [ "${fail}" -eq 0 ]

      - name: Assert the injected env actually reached the backend container
        run: |
          set -euo pipefail
          # Proves the append-to-backend/.env above took effect. If it silently did
          # not, the app still boots with FILE_ENCRYPTION_KEY="" and only explodes
          # on the first upload - a far more confusing failure to debug.
          jwt="$(docker compose exec -T backend printenv JWT_SECRET)"
          key="$(docker compose exec -T backend printenv FILE_ENCRYPTION_KEY)"
          storage="$(docker compose exec -T backend printenv STORAGE_DIR)"
          test -n "${jwt}"
          [ "${jwt}" != "change-me" ]
          test -n "${key}"
          if [ "${storage}" != "/data/files" ]; then
            echo "::error::STORAGE_DIR is '${storage}', expected /data/files (the file_data volume mount)"
            exit 1
          fi
          echo "env plumbing ok (values withheld); STORAGE_DIR=${storage}"

      - name: HTTP smoke through Caddy (health, SPA, login, /auth/me)
        run: |
          set -euo pipefail
          # Only `proxy` publishes ports (80/443). Talking to the backend or the
          # frontend container directly would exercise a path no user can reach,
          # so everything below goes through Caddy on :80 (SITE_ADDRESS=:80, no
          # TLS, so no certificate dance on the runner).

          for i in $(seq 1 60); do
            if curl -fsS -m 5 http://localhost/api/health >/dev/null 2>&1; then
              echo "api reachable after ${i} attempt(s)"
              break
            fi
            echo "waiting for http://localhost/api/health (${i}/60)"
            sleep 2
          done

          # Caddy's `handle_path /api/*` strips the prefix, so this is the
          # backend's GET /health.
          health="$(curl -fsS -m 10 http://localhost/api/health)"
          echo "health: ${health}"
          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); assert d["status"] == "ok", d' "${health}"

          # Everything outside /api is the nginx-served Vite bundle.
          curl -fsS -m 10 http://localhost/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          echo "SPA served, React mount point present"

          # POST /auth/login takes an OAuth2PasswordRequestForm: form-encoded
          # `username` (treated as the email) plus `password`.
          curl -fsS -m 15 -X POST http://localhost/api/auth/login \
            --data-urlencode "username=${SMOKE_ADMIN_EMAIL}" \
            --data-urlencode "password=${SMOKE_ADMIN_PASSWORD}" \
            -o /tmp/token.json
          token="$(python3 -c 'import json; print(json.load(open("/tmp/token.json"))["access_token"])')"
          test -n "${token}"
          echo "login returned a token (${#token} chars)"

          # This also proves app/seed.py ran inside entrypoint.sh AND that it read
          # the ADMIN_EMAIL we injected.
          curl -fsS -m 15 http://localhost/api/auth/me \
            -H "Authorization: Bearer ${token}" -o /tmp/me.json
          python3 - "${SMOKE_ADMIN_EMAIL}" <<'PY'
          import json, sys

          me = json.load(open("/tmp/me.json"))
          assert me["email"] == sys.argv[1], f"expected {sys.argv[1]!r}, got {me!r}"
          assert me["is_admin"] is True, f"the seeded admin is not an admin: {me!r}"
          print("/auth/me ok:", me["email"], "is_admin =", me["is_admin"])
          PY

          # Hand the token to the next step.
          echo "SMOKE_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Upload -> real tesseract-ita OCR -> full-text search round-trip
        run: |
          set -euo pipefail

          # Render the sample page INSIDE the backend image on purpose: that also
          # proves the image's own Pillow, fonts and tesseract-ita are present,
          # rather than the runner's apt packages.
          docker compose exec -T backend python3 - < .github/scripts/render-sample-referto.py

          # Copy it out so the upload travels through Caddy, like a browser's.
          #
          # NOTE the filename. The FTS expression is
          #   to_tsvector('italian', coalesce(ocr_text,'') || ' ' || original_filename)
          # so a filename containing "piastrine" would satisfy the search
          # assertion below even with OCR completely broken. Keep it wordless.
          rm -f scan-001.png
          docker compose cp backend:/tmp/ocr-sample.png ./scan-001.png
          ls -l scan-001.png

          doc_id="$(curl -fsS -m 120 -X POST http://localhost/api/documents \
            -H "Authorization: Bearer ${SMOKE_TOKEN}" \
            -F "file=@scan-001.png;type=image/png" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          echo "uploaded document id=${doc_id}"

          # OCR runs as a FastAPI BackgroundTask, so the upload response is
          # status=uploaded and the work happens after it. Poll, capped at 120s.
          status=""
          for i in $(seq 1 60); do
            status="$(curl -fsS -m 15 "http://localhost/api/documents/${doc_id}" \
              -H "Authorization: Bearer ${SMOKE_TOKEN}" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
            echo "  poll ${i}/60: status=${status}"
            if [ "${status}" = "ocr_done" ]; then
              break
            fi
            if [ "${status}" = "ocr_failed" ]; then
              echo "::error::OCR failed inside the backend container - check tesseract / poppler in backend/Dockerfile"
              exit 1
            fi
            sleep 2
          done
          if [ "${status}" != "ocr_done" ]; then
            echo "::error::document ${doc_id} never reached ocr_done (last status: ${status})"
            exit 1
          fi

          # Print what tesseract actually read. Invaluable when this step breaks.
          curl -fsS -m 60 -X POST "http://localhost/api/documents/${doc_id}/ocr" \
            -H "Authorization: Bearer ${SMOKE_TOKEN}" -o /tmp/ocr.json
          python3 -c 'import json; print("--- OCR excerpt ---"); print(json.load(open("/tmp/ocr.json"))["ocr_text_excerpt"])'

          # Search for one distinctive word. OCR of a rendered image is never
          # character-perfect and Postgres applies the italian stemmer, so a whole
          # phrase would be flaky; "piastrine" -> "piastrin" is robust.
          # Deliberately NOT asserted: the extracted doc_date and the guessed
          # visit type. Both are heuristics and both are legitimately unreliable.
          curl -fsS -m 15 -G "http://localhost/api/documents" \
            --data-urlencode "q=piastrine" \
            -H "Authorization: Bearer ${SMOKE_TOKEN}" -o /tmp/search.json
          python3 - "${doc_id}" <<'PY'
          import json, sys

          want = int(sys.argv[1])
          ids = [d["id"] for d in json.load(open("/tmp/search.json"))]
          print("hits for q=piastrine:", ids)
          assert want in ids, f"full-text search did not find document {want}; hits={ids}"
          PY

          # Negative control: without it, an endpoint that ignored `q` entirely
          # would still satisfy the assertion above.
          curl -fsS -m 15 -G "http://localhost/api/documents" \
            --data-urlencode "q=zzqqxwvfrobnicate" \
            -H "Authorization: Bearer ${SMOKE_TOKEN}" -o /tmp/search-none.json
          python3 - <<'PY'
          import json

          hits = json.load(open("/tmp/search-none.json"))
          assert hits == [], f"the q= filter is being ignored: a nonsense query returned {hits!r}"
          print("negative control ok: nonsense query returns no hits")
          PY

      - name: Encrypted file landed on the mounted volume
        run: |
          set -euo pipefail
          # STORAGE_DIR must resolve to the file_data volume mount. Python does
          # NOT expand "~", so a value like ~/.docarch creates a literal "~"
          # directory in the container's writable layer: uploads appear to work,
          # and every document is destroyed by the next `docker compose build`.
          # This assertion makes that class of bug unmergeable.
          docker compose exec -T backend sh -c 'ls -l /data/files/*/*.enc'

          # ...and prove /data/files really is the volume, not just a path that
          # happens to exist inside the image.
          mounts="$(docker inspect -f '{{range .Mounts}}{{.Type}}:{{.Destination}} {{end}}' "$(docker compose ps -q backend)")"
          echo "backend mounts: ${mounts}"
          echo "${mounts}" | grep -q 'volume:/data/files'

          # Cheap end-to-end proof of encryption at rest: a Fernet token is
          # urlsafe-base64 of a 0x80 version byte first, so it always starts
          # "gAAAA". Plaintext PNG bytes would not.
          magic="$(docker compose exec -T backend sh -c 'f=$(ls /data/files/*/*.enc | head -1); head -c 5 "$f"')"
          echo "first bytes on disk: ${magic}"
          if [ "${magic}" != "gAAAA" ]; then
            echo "::error::the stored file does not look Fernet-encrypted (got '${magic}', expected 'gAAAA')"
            exit 1
          fi

      - name: The real Alembic migration ran
        run: |
          set -euo pipefail
          # The pytest suite still builds its schema with Base.metadata.create_all(),
          # so entrypoint.sh's `alembic upgrade head` is exercised HERE and nowhere
          # else. POSTGRES_DB is `docarchive` for the compose stack (only the CI
          # service container in backend-test uses docarchive_test).
          version="$(docker compose exec -T db psql -U docarchive -d docarchive -tAc 'select version_num from alembic_version' | tr -d '[:space:]')"
          head="$(docker compose exec -T backend alembic heads | grep '(head)' | awk '{print $1}')"
          echo "alembic_version in the database: '${version}'"
          echo "head in backend/alembic/versions: '${head}'"
          test -n "${version}"
          if [ "${version}" != "${head}" ]; then
            echo "::error::the database is stamped at '${version}' but the repo head is '${head}'"
            exit 1
          fi

          # The FTS GIN index is raw SQL inside the migration body and is absent
          # from Base.metadata, so create_all() cannot produce it. Its presence
          # proves the migration really executed, not merely that tables exist.
          indexes="$(docker compose exec -T db psql -U docarchive -d docarchive -tAc "select indexname from pg_indexes where tablename='documents'")"
          echo "${indexes}"
          echo "${indexes}" | grep -qx ix_documents_fts

      - name: Diagnostics (on failure)
        if: failure()
        # No `set -e` here on purpose: every command must run even if an earlier
        # one fails, because this output is the only debugging material left once
        # the runner is destroyed.
        run: |
          echo "=================== docker compose ps -a ==================="
          docker compose ps -a || true
          echo "=================== docker compose logs ===================="
          docker compose logs --tail=300 --no-color || true
          echo "=================== backend inspect ========================"
          docker inspect "$(docker compose ps -q backend)" || true

      - name: Tear down
        if: always()
        run: |
          set -euo pipefail
          # `-v` destroys the named volumes: db_data (the entire database) and
          # file_data (every encrypted document). That is correct and necessary on
          # a throwaway CI runner, and it is NEVER acceptable on the VPS - there,
          # use plain `docker compose down`. Do not copy this line into a deploy
          # script or a runbook.
          docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # 5. Restore rehearsal: prove ops/backup.sh -> ops/restore.sh actually round-trips.
  #
  #    Backup verification belongs in TWO places and they test different things.
  #
  #    On the host, monthly (ops/systemd/docarchive-verify.timer): verifies the
  #    DATA and the KEY. Only possible there, because only there are the real
  #    documents and the real FILE_ENCRYPTION_KEY. CI must never see either.
  #
  #    Here: verifies the SCRIPTS. This is what stops ops/restore.sh bit-rotting
  #    into a file that references a volume name which changed six months ago -
  #    discovered, otherwise, during an actual disaster.
  # ---------------------------------------------------------------------------
  restore-rehearsal:
    name: restore rehearsal
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SMOKE_ADMIN_EMAIL: smoke-admin@example.com
      SMOKE_ADMIN_PASSWORD: smoke-admin-not-a-secret
      COMPOSE_PROJECT_NAME: docarchive

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
          age --version

      - name: Synthesize env files from the committed examples
        run: .github/scripts/synthesize-env.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          build-args: GIT_SHA=${{ github.sha }}
          tags: docarchive-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: docarchive-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Boot the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Seed one real, OCR'd document
        run: |
          set -euo pipefail

          token="$(curl -fsS -m 30 -X POST http://localhost/api/auth/login \
            -d "username=${SMOKE_ADMIN_EMAIL}" -d "password=${SMOKE_ADMIN_PASSWORD}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"

          docker compose exec -T backend python3 - < .github/scripts/render-sample-referto.py
          rm -f scan-001.png
          docker compose cp backend:/tmp/ocr-sample.png ./scan-001.png

          doc_id="$(curl -fsS -m 120 -X POST http://localhost/api/documents \
            -H "Authorization: Bearer ${token}" \
            -F "file=@scan-001.png;type=image/png" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          # Wait for OCR so the restored archive has ocr_text, which is what makes
          # verify-backup.sh's full-text assertion meaningful. That assertion is
          # the one that proves the raw-SQL ix_documents_fts GIN index survived
          # pg_restore - alembic autogenerate cannot see that index, so nothing
          # else in this repo would notice it going missing.
          for _ in $(seq 1 60); do
            status="$(curl -fsS -m 15 "http://localhost/api/documents/${doc_id}" \
              -H "Authorization: Bearer ${token}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            [ "${status}" = "ocr_done" ] && break
            sleep 2
          done
          [ "${status}" = "ocr_done" ] || { echo "::error::document never reached ocr_done (${status})"; exit 1; }

          # The fingerprint the whole job hinges on: the exact plaintext bytes the
          # API served BEFORE any backup existed.
          curl -fsS -m 60 -H "Authorization: Bearer ${token}" \
            "http://localhost/api/documents/${doc_id}/file" -o original.bin
          sha256sum original.bin | awk '{print $1}' > original.sha256

          echo "DOC_ID=${doc_id}" >> "${GITHUB_ENV}"
          echo "seeded document ${doc_id}, $(stat -c%s original.bin) bytes"

      - name: Back up
        run: |
          set -euo pipefail
          # A throwaway keypair generated in-job. The real recipient key in
          # ops/backup-recipient.txt belongs to the operator, and CI has no
          # business holding anything that could open a real backup.
          age-keygen -o "${RUNNER_TEMP}/age.key" 2>/dev/null
          grep -oP '(?<=^# public key: ).*' "${RUNNER_TEMP}/age.key" > "${RUNNER_TEMP}/recipient.txt"

          BACKUP_DIR="${RUNNER_TEMP}/backups" \
          RECIPIENT_FILE="${RUNNER_TEMP}/recipient.txt" \
            ops/backup.sh

          ls -l "${RUNNER_TEMP}/backups"

      - name: Destroy everything
        run: |
          set -euo pipefail
          # `-v` genuinely destroys db_data and file_data. Safe here, and the
          # entire point: a restore that runs against a stack which was never
          # actually destroyed proves nothing.
          docker compose down -v --remove-orphans
          docker volume ls

      - name: Restore
        run: |
          set -euo pipefail
          # Names are UTC stamps, so lexicographic order IS chronological.
          # Globbing beats `ls -1t` here: no parsing of ls output.
          backup="$(printf '%s\n' "${RUNNER_TEMP}"/backups/*.tar.age | sort | tail -1)"
          AGE_IDENTITY="${RUNNER_TEMP}/age.key" \
            ops/restore.sh --yes-destroy-current-data "${backup}"

      - name: Verify
        run: |
          set -euo pipefail
          # Names are UTC stamps, so lexicographic order IS chronological.
          # Globbing beats `ls -1t` here: no parsing of ls output.
          backup="$(printf '%s\n' "${RUNNER_TEMP}"/backups/*.tar.age | sort | tail -1)"
          manifest_dir="$(mktemp -d)"
          age -d -i "${RUNNER_TEMP}/age.key" < "${backup}" \
            | tar -C "${manifest_dir}" -xf - ./MANIFEST.txt

          ops/verify-backup.sh --manifest "${manifest_dir}/MANIFEST.txt"

      - name: Restored bytes are identical to the originals
        run: |
          set -euo pipefail
          # The end-to-end proof, and the assertion the README used to make
          # implicitly and never once tested: a restored archive is byte-identical
          # to what went in. verify-backup.sh checks magic bytes and sizes; this
          # checks the whole file.
          token="$(curl -fsS -m 30 -X POST http://localhost/api/auth/login \
            -d "username=${SMOKE_ADMIN_EMAIL}" -d "password=${SMOKE_ADMIN_PASSWORD}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"

          curl -fsS -m 60 -H "Authorization: Bearer ${token}" \
            "http://localhost/api/documents/${DOC_ID}/file" -o restored.bin

          before="$(cat original.sha256)"
          after="$(sha256sum restored.bin | awk '{print $1}')"
          echo "before ${before}"
          echo "after  ${after}"
          if [ "${before}" != "${after}" ]; then
            echo "::error::restored document ${DOC_ID} does not match the original"
            exit 1
          fi
          echo "byte-identical after a full destroy-and-restore cycle"

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --tail=200 --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
