version: 2

# Strategy: minor + patch updates arrive as ONE grouped PR per ecosystem per week,
# because reviewing eleven "bump 2.0.1 -> 2.0.2" PRs teaches you to rubber-stamp
# them. Majors are left ungrouped on purpose - each one needs a human to read the
# changelog, and CI's smoke job is what tells you whether the stack still boots.

updates:
  # --- Backend: requirements.txt + requirements-dev.txt -----------------------
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    labels:
      - dependencies
      - backend
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Frontend: package.json + package-lock.json ----------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - dependencies
      - frontend
    groups:
      # A dependency lands in the FIRST group it matches, so these two must stay
      # above the catch-all below.
      #
      # React and its types have to move as one unit. Ungrouped, Dependabot opens
      # react + @types/react in one PR and react-dom + @types/react-dom in
      # another; each one alone fails `npm ci` with an ERESOLVE peer conflict
      # (@types/react-dom@18 requires @types/react@^18), so neither can ever go
      # green no matter how often it is rebased. No update-types filter here on
      # purpose: the constraint binds hardest on majors.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Same shape of problem: @vitejs/plugin-react declares a vite peer range, so
      # a solo vite major is unmergeable by construction.
      vite:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vitest"
          - "@vitest/*"
      frontend-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- Base images: backend/Dockerfile, frontend/Dockerfile, docker-compose.yml
  # `directories` (plural) so one entry covers both Dockerfiles and the compose
  # file's pinned images (postgres:16-alpine, caddy:2-alpine, nginx:1.27-alpine).
  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker
    ignore:
      # A Python MAJOR is a coordinated change, not a dependency bump:
      # psycopg2-binary ships no cp314 wheel, so an automatic 3.14 bump fails the
      # image build outright while pip tries to compile psycopg2 from source.
      # Bump it by hand.
      #
      # The MINOR ignore is gone. It only existed because the workflow hardcoded
      # "3.12" in two places, so a 3.12 -> 3.13 bump would have left CI testing a
      # runtime the image no longer shipped. The `validate` job now reads the
      # version out of backend/Dockerfile, so a minor bump is fully tested by the
      # PR that proposes it - which is the same reason Node was never ignored.
      - dependency-name: python
        update-types:
          - version-update:semver-major
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # --- The CI workflow's own actions ----------------------------------------
  - package-ecosystem: github-actions
    # Must be "/" - Dependabot always looks in .github/workflows from the root.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
