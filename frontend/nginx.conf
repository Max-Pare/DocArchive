server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in the Server header or on error pages.
    server_tokens off;

    # Container healthcheck target. Kept out of the access log so it doesn't
    # drown out real traffic at a 15s interval.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        # The app shell must never be cached: it references content-hashed asset
        # filenames, so a stale index.html points at bundles that no longer exist.
        add_header Cache-Control "no-store, must-revalidate";
    }

    # static asset caching. Safe to cache hard because Vite content-hashes these.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
